<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q-in-a-Pocket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
:root{--bg:#eaf0f5;--sf:#fff;--tx:#14202b;--mu:#5b6b7a;--ac:#c76a00;--on:#fff;--ln:#c9d4de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16212e;--sf:#223246;--tx:#f1ede4;--mu:#9fb0c1;--ac:#f2a93b;--on:#16212e;--ln:#34485f}}
:root[data-theme="dark"]{--bg:#16212e;--sf:#223246;--tx:#f1ede4;--mu:#9fb0c1;--ac:#f2a93b;--on:#16212e;--ln:#34485f}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Barlow,system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:800;margin:0;line-height:1}
h1{font-size:34px}
h2{font-size:24px;margin:20px 0 8px}
.sub{color:var(--mu);margin:4px 0 14px}
nav{display:flex;gap:6px;margin:0 0 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;padding:12px 0;border:2px solid var(--ln);background:transparent;color:var(--tx);font:800 20px "Barlow Condensed","Arial Narrow",sans-serif;border-radius:8px}
nav button[aria-selected="true"]{background:var(--ac);border-color:var(--ac);color:var(--on)}
button{cursor:pointer;font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;padding:12px;border:2px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit}
textarea{min-height:300px;font:14px/1.4 ui-monospace,Menlo,monospace}
.row{display:flex;gap:10px}.row>*{flex:1}
.btn{padding:14px;border:0;border-radius:8px;background:var(--ac);color:var(--on);font:800 22px "Barlow Condensed","Arial Narrow",sans-serif;width:100%;margin-top:14px}
.btn.alt{background:transparent;color:var(--tx);border:2px solid var(--ln)}
.sec{background:var(--sf);border-radius:10px;padding:4px 14px 10px;margin-top:14px;border-left:6px solid var(--ac)}
.sec h2{margin:12px 0 4px}
.sec small{color:var(--mu);font-weight:600}
.ex{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--ln)}
.ex:first-of-type{border-top:0}
.ex span{flex:1;font-weight:600}
.ex em{font-style:normal;color:var(--mu)}
.ex button{width:44px;height:44px;border:2px solid var(--ln);border-radius:8px;background:transparent;color:var(--tx);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{padding:10px 14px;border:2px solid var(--ln);border-radius:999px;background:transparent;color:var(--tx);font-weight:600}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--on)}
.run{text-align:center;padding-top:8px}
.clock{font:800 88px "Barlow Condensed","Arial Narrow",sans-serif;line-height:1}
.now{font:800 52px/1.05 "Barlow Condensed","Arial Narrow",sans-serif;margin:20px 0 6px;overflow-wrap:anywhere}
.next{color:var(--mu);min-height:24px}
.empty{color:var(--mu);padding:24px 0;text-align:center}
.bar{height:8px;background:var(--ln);border-radius:4px;margin:14px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);width:0}
</style>
</head>
<body>
<main>
<h1>Q-in-a-Pocket</h1>
<p class="sub">Plan the beatdown, run it, post the backblast.</p>
<nav role="tablist">
<button role="tab" id="t-plan" aria-selected="true">Plan</button>
<button role="tab" id="t-run" aria-selected="false">Run</button>
<button role="tab" id="t-bb" aria-selected="false">Backblast</button>
</nav>
<div id="view"></div>
</main>
<script>
var LIB={
warm:["Side Straddle Hops","Imperial Walkers","Windmills","Arm Circles","Hillbillies","Mountain Climbers","Good Mornings","Cherry Pickers","Slow Squats"],
mary:["LBCs","Flutter Kicks","Plank Hold","American Hammers","Box Cutters","Freddie Mercury","Hello Dollies","Low Slow Flutters","Peter Parkers"],
thang:[["Burpees","F"],["Merkins","U"],["Squats","L"],["Walking Lunges","L"],["Bear Crawls","F"],["Carolina Dry Docks","U"],["Diamond Merkins","U"],["Jump Squats","L"],["Hand Release Merkins","U"],["Bonnie Blairs","C"],["Sprints","C"],["Mountain Climbers","C"],["Monkey Humpers","C"],["Dips","U"],["Squat Jumps","L"],["High Knees","C"],["Crab Walks","F"],["Broad Jumps","L"],["Duck Walks","L"]],
coupon:[["Curls","U"],["Overhead Press","U"],["Goblet Squats","L"],["Thrusters","F"],["Coupon Swings","F"],["Bent Rows","U"],["Coupon Carry","F"],["Blockee Burpees","F"],["Squat Press","L"],["Step-ups","L"]]};
var FOCUS={Full:"",Legs:"L",Upper:"U",Cardio:"C"};
var S={tab:"plan",mins:45,coupon:false,mary:true,f1:"Random",f2:"Random",focus:"Full",plan:null,step:0,left:0,on:false,timer:null,q:"",ao:"",fngs:"",note:"",pax:[],here:{}};
try{S.pax=JSON.parse(localStorage.getItem("f3pax")||"[]")}catch(e){}
function savePax(){try{localStorage.setItem("f3pax",JSON.stringify(S.pax))}catch(e){}}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function thangPool(){var p=LIB.thang.slice();if(S.coupon)p=p.concat(LIB.coupon);var f=FOCUS[S.focus];if(f){var m=p.filter(function(x){return x[1]===f||x[1]==="F"});if(m.length>=5)p=m}return p.map(function(x){return x[0]})}
var DIST={"Bear Crawls":1.2,"Walking Lunges":1.2,"Sprints":.4,"Coupon Carry":.8,"Crab Walks":1.2,"Broad Jumps":1.5,"Duck Walks":1.5};
function reps(sec,nm){if(DIST[nm])return pick(nm==="Sprints"?[40,50,60]:[20,25,30,40])+" yds";if(nm==="Plank Hold")return pick(["30 sec","45 sec","60 sec"]);return sec==="thang"?pick(["x10","x15","x20","x25"]):sec==="warm"?pick(["x15 IC","x20 IC","x25 IC"]):pick(["x20 IC","x25 IC","x30 IC"])}
function secs(key,r,nm){var y=/(\d+) yds/.exec(r);if(y)return y[1]*(DIST[nm]||1)+15;var m=/(\d+) sec/.exec(r);if(m)return +m[1]+10;var n=parseInt(r.slice(1),10);return n*(key==="thang"?3.5:2)+(key==="thang"?15:10)}
function lbl(it){return(it.lab?it.lab+": ":"")+it.n}
function FM(v){return["Random","Rounds","4 Corners","Sevens","Dora 1-2-3"].map(function(x){return'<option'+(x===v?" selected":"")+'>'+x+'</option>'}).join("")}
function calc(s,target){
var f=s.fmt||"Rounds";s.target=target;s.rounds=1;
if(f==="Dora 1-2-3"){var u=Math.max(10,Math.min(100,Math.round(target/180)*10));s.items.forEach(function(it,i){it.r="x"+u*(i+1)});s.secs=u*18+60}
else if(f==="Sevens"){s.secs=s.items.length/2*400}
else{var tr=f==="4 Corners"?20:0,one=s.items.reduce(function(a,it){return a+secs(s.key,it.r,it.n)+tr},0);s.rounds=Math.max(1,Math.min(f==="4 Corners"?4:6,Math.round(target/one)));s.secs=one*s.rounds}
s.mins=Math.max(1,Math.round(s.secs/60))}
function mkT(title,f,pool,n,target){
var s={key:"thang",title:title,fmt:f,items:[]};
var rp=pool.filter(function(x){return !DIST[x]});if(rp.length<6)rp=pool;
function nm(a){return a.map(function(x){return{n:x,r:reps("thang",x)}})}
if(f==="4 Corners"){s.items=nm(shuffle(pool).slice(0,4));s.items.forEach(function(it,i){it.lab="Corner "+(i+1)});s.note="Travel between corners: "+pick(["bear crawl","mosey","lunge walk","crab walk","sprint"])+"."}
else if(f==="Sevens"){var np=Math.max(1,Math.min(3,Math.round(target/400),Math.floor(rp.length/2))),a=shuffle(rp).slice(0,np*2);for(var i=0;i<np;i++){s.items.push({n:a[2*i],r:"7 down to 1",lab:"Pair "+(i+1)+", end A",fixed:true},{n:a[2*i+1],r:"1 up to 7",lab:"Pair "+(i+1)+", end B",fixed:true})}s.note="Two lines about 25 yds apart. Do your A reps, run to B, do your B reps, run back. The reps swap every trip."}
else if(f==="Dora 1-2-3"){s.items=nm(shuffle(rp).slice(0,3));s.items.forEach(function(it,i){it.fixed=true;it.lab="Exercise "+(i+1)});s.note="Partner up. One partner runs a lap while the other does reps, then swap. Reps go 1x, 2x, 3x."}
else{s.fmt="Rounds";s.items=nm(shuffle(pool).slice(0,n))}
calc(s,target);return s}
function gen(){
var m=S.mins,nT=m>=60?5:4,nW=m>=60?5:4,nM=m>=45?4:3;
function mk(key,title,pool,n,share){var s={key:key,title:title,items:shuffle(pool).slice(0,n).map(function(x){return{n:x,r:reps(key,x)}})};calc(s,m*60*share);return s}
var tp=S.mary?.33:.43,F=["Rounds","4 Corners","Sevens","Dora 1-2-3"];
function fm(v){return v==="Random"?pick(F):v}
var f1=fm(S.f1),f2=fm(S.f2);if(S.f1==="Random"&&S.f2==="Random"&&f1===f2)f2=pick(F.filter(function(x){return x!==f1}));
var t1=mkT("Thang 1",f1,thangPool(),nT,m*60*(tp-.01));
var used=t1.items.map(function(x){return x.n}),pool2=thangPool().filter(function(x){return used.indexOf(x)<0});if(pool2.length<6)pool2=thangPool();
S.plan=[mk("warm","Warm-o-rama",LIB.warm,nW,.15),t1,mkT("Thang 2",f2,pool2,nT,m*60*tp)];
if(S.mary)S.plan.push(mk("mary","Mary",LIB.mary,nM,.2));
S.step=0;stop();S.left=S.plan[0].secs;
}
function flat(){var o=[];S.plan.forEach(function(s,si){for(var r=1;r<=s.rounds;r++)s.items.forEach(function(it,ii){o.push({si:si,ii:ii,n:lbl(it),r:it.r,note:s.note,t:s.title+(s.fmt&&s.fmt!=="Rounds"?" ("+s.fmt+")":"")+(s.rounds>1?", "+(s.fmt==="4 Corners"?"lap ":"round ")+r+" of "+s.rounds:"")})})});return o}
function fmt(s){var m=Math.floor(s/60),r=s%60;return m+":"+(r<10?"0":"")+r}
function stop(){S.on=false;if(S.timer){clearInterval(S.timer);S.timer=null}}
function go(i){var f=flat();if(i<0||i>=f.length)return;var prev=f[S.step]?f[S.step].si:-1;S.step=i;if(f[i].si!==prev)S.left=S.plan[f[i].si].secs;draw()}
function tick(){S.left--;if(S.left<=0){try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}var f=flat(),cur=f[S.step].si,j=S.step;while(j<f.length&&f[j].si===cur)j++;if(j>=f.length){stop();S.left=0}else{S.step=j;S.left=S.plan[f[j].si].secs}}draw()}
function toggle(){if(S.on){stop()}else{S.on=true;S.timer=setInterval(tick,1000)}draw()}
function setTab(t){S.tab=t;["plan","run","bb"].forEach(function(k){document.getElementById("t-"+k).setAttribute("aria-selected",k===t)});draw()}
["plan","run","bb"].forEach(function(k){document.getElementById("t-"+k).onclick=function(){setTab(k)}});

function viewPlan(){
var h='<div class="row"><div><label for="mins">Length</label><select id="mins">'+[30,45,60].map(function(m){return'<option value="'+m+'"'+(m===S.mins?" selected":"")+'>'+m+' minutes</option>'}).join("")+'</select></div>'+
'<div><label for="foc">Focus</label><select id="foc">'+Object.keys(FOCUS).map(function(k){return'<option'+(k===S.focus?" selected":"")+'>'+k+'</option>'}).join("")+'</select></div></div>'+
'<div class="row"><div><label for="f1">Thang 1 format</label><select id="f1">'+FM(S.f1)+'</select></div><div><label for="f2">Thang 2 format</label><select id="f2">'+FM(S.f2)+'</select></div></div>'+'<label><input type="checkbox" id="cp" style="width:auto;margin-right:8px"'+(S.coupon?" checked":"")+'>Bring coupons (blocks)</label>'+'<label><input type="checkbox" id="my" style="width:auto;margin-right:8px"'+(S.mary?" checked":"")+'>Include Mary</label>'+
'<button class="btn" id="gen">'+(S.plan?"Build a new beatdown":"Build the beatdown")+'</button>';
if(!S.plan)return h+'<p class="empty">Pick a length and focus, then build. You can swap any move.</p>';
S.plan.forEach(function(s,si){h+='<section class="sec"><h2>'+s.title+' <small>'+(s.fmt&&s.fmt!=="Rounds"?s.fmt+', ':'')+(s.rounds>1?s.rounds+(s.fmt==="4 Corners"?' laps, ':' rounds, '):'')+'about '+s.mins+' min</small></h2>'+(s.note?'<p class="sub" style="margin:0 0 6px">'+esc(s.note)+'</p>':'');s.items.forEach(function(it,ii){h+='<div class="ex"><span>'+esc(lbl(it))+' <em>'+it.r+'</em></span><button data-sw="'+si+','+ii+'" aria-label="Swap '+esc(it.n)+'">&#8635;</button>'+(s.fmt&&s.fmt!=="Rounds"?"":'<button data-rm="'+si+','+ii+'" aria-label="Remove '+esc(it.n)+'">&#10005;</button>')+'</div>'});h+='</section>'});
return h+'<button class="btn alt" id="goRun">Start run mode</button>';
}
function bindPlan(){
document.getElementById("mins").onchange=function(e){S.mins=+e.target.value};
document.getElementById("foc").onchange=function(e){S.focus=e.target.value};
document.getElementById("cp").onchange=function(e){S.coupon=e.target.checked};
document.getElementById("my").onchange=function(e){S.mary=e.target.checked};
document.getElementById("f1").onchange=function(e){S.f1=e.target.value};
document.getElementById("f2").onchange=function(e){S.f2=e.target.value};
document.getElementById("gen").onclick=function(){gen();draw()};
var g=document.getElementById("goRun");if(g)g.onclick=function(){setTab("run")};
document.querySelectorAll("[data-sw]").forEach(function(b){b.onclick=function(){var p=b.dataset.sw.split(","),s=S.plan[p[0]],used=s.items.map(function(x){return x.n});var pool=(s.key==="thang"?thangPool():LIB[s.key]).filter(function(x){return used.indexOf(x)<0&&!(s.fmt&&s.fmt!=="Rounds"&&s.fmt!=="4 Corners"&&DIST[x])});if(pool.length){var it=s.items[p[1]];it.n=pick(pool);if(!it.fixed)it.r=reps(s.key,it.n);calc(s,s.target)}draw()}});
document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){var p=b.dataset.rm.split(","),s=S.plan[p[0]];if(s.items.length>1){s.items.splice(p[1],1);calc(s,s.target);S.step=0;S.left=S.plan[0].secs}draw()}});
}
function viewRun(){
if(!S.plan)return'<p class="empty">Build a beatdown in the Plan tab first.</p>';
var f=flat(),c=f[S.step],n=f[S.step+1],tot=S.plan[c.si].secs;
return'<div class="run"><div class="sub">'+c.t+(c.note?"<br>"+esc(c.note):"")+'</div><div class="clock">'+fmt(S.left)+'</div><div class="bar"><i style="width:'+Math.max(0,Math.min(100,100-S.left/tot*100))+'%"></i></div>'+
'<div class="now">'+esc(c.n)+'<br>'+c.r+'</div><div class="next">'+(n?"Next: "+esc(n.n)+" "+n.r:"Last one. Count-o-rama, then COT.")+'</div>'+
'<button class="btn" id="pp">'+(S.on?"Pause":(S.left<=0?"Done":"Start the clock"))+'</button>'+
'<div class="row"><button class="btn alt" id="pv">Back</button><button class="btn alt" id="nx">Next move</button></div></div>';
}
function bindRun(){var p=document.getElementById("pp");if(!p)return;p.onclick=toggle;document.getElementById("pv").onclick=function(){go(S.step-1)};document.getElementById("nx").onclick=function(){go(S.step+1)}}
function bbText(){
var names=S.pax.filter(function(p){return S.here[p]});
var d=document.getElementById("dt")?document.getElementById("dt").value:new Date().toISOString().slice(0,10);
var L=["BACKBLAST!","AO: "+S.ao,"Date: "+d,"Q: "+S.q,"PAX: "+names.join(", "),"FNGs: "+(S.fngs||"None"),"Count: "+(names.length+(S.q?1:0)+(S.fngs?S.fngs.split(",").length:0)),""];
if(S.plan)S.plan.forEach(function(s){L.push(s.title.toUpperCase()+(s.fmt&&s.fmt!=="Rounds"?" - "+s.fmt:"")+(s.rounds>1?" ("+s.rounds+(s.fmt==="4 Corners"?" laps)":" rounds)"):"")+":");if(s.note)L.push(s.note);s.items.forEach(function(it){L.push("- "+lbl(it)+" "+it.r)});L.push("")});
L.push("Notes: "+S.note,"","Aye!");return L.join("\n");
}
function viewBB(){
var today=new Date().toISOString().slice(0,10);
return'<div class="row"><div><label for="ao">AO</label><input id="ao" value="'+esc(S.ao)+'"></div><div><label for="dt">Date</label><input id="dt" type="date" value="'+today+'"></div></div>'+
'<div class="row"><div><label for="q">Q</label><input id="q" value="'+esc(S.q)+'"></div><div><label for="fn">FNGs</label><input id="fn" value="'+esc(S.fngs)+'"></div></div>'+
'<label>Who posted? Tap names</label><div class="chips" id="chips">'+(S.pax.length?S.pax.map(function(p,i){return'<button class="chip" data-p="'+i+'" aria-pressed="'+!!S.here[p]+'">'+esc(p)+'</button>'}).join(""):'<span class="sub">No pax yet. Add F3 names below.</span>')+'</div>'+
'<div class="row"><input id="np" placeholder="Add an F3 name" aria-label="New F3 name"><button class="btn alt" id="add" style="margin-top:0;flex:0 0 90px">Add</button></div>'+
'<label for="nt">Notes and announcements</label><input id="nt" value="'+esc(S.note)+'">'+
'<label for="out">Backblast</label><textarea id="out"></textarea>'+
'<button class="btn" id="cpy">Copy backblast</button>';
}
function bindBB(){
var out=document.getElementById("out");function upd(){out.value=bbText()}
[["ao","ao"],["q","q"],["fn","fngs"],["nt","note"]].forEach(function(x){document.getElementById(x[0]).oninput=function(e){S[x[1]]=e.target.value;upd()}});
document.getElementById("dt").oninput=upd;
document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){var p=S.pax[b.dataset.p];S.here[p]=!S.here[p];b.setAttribute("aria-pressed",!!S.here[p]);upd()}});
document.getElementById("add").onclick=function(){var v=document.getElementById("np").value.trim();if(v&&S.pax.indexOf(v)<0){S.pax.push(v);S.here[v]=true;savePax();draw()}};
document.getElementById("cpy").onclick=function(){var b=this;function ok(){b.textContent="Copied"}out.select();try{navigator.clipboard.writeText(out.value).then(ok,function(){document.execCommand("copy");ok()})}catch(e){document.execCommand("copy");ok()}};
upd();
}
function draw(){
var v=document.getElementById("view");
if(S.tab==="bb"){var a=document.activeElement&&document.activeElement.id;v.innerHTML=viewBB();bindBB();return}
if(S.tab==="run"){v.innerHTML=viewRun();bindRun();return}
v.innerHTML=viewPlan();bindPlan();
}
draw();
</script>
</body>
</html>
